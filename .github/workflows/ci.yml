# CI (ADR 0001): o .exe de release sai daqui. Linux e Windows rodam o mesmo
# portão do CLAUDE.md (fmt, clippy -D warnings, testes) e publicam o binário
# release como artefato, com o tamanho medido contra o teto de 8 MB.
name: ci

on:
  push:
    branches: [main, "fase-*", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: testes
        run: cargo test

      - name: build release
        run: cargo build --release

      - name: tamanho do binário (teto 8 MB)
        shell: bash
        run: |
          bin=target/release/openkax
          [[ "$RUNNER_OS" == "Windows" ]] && bin="$bin.exe"
          size=$(wc -c < "$bin" | tr -d ' ')
          mib=$(awk "BEGIN { printf \"%.2f\", $size / 1048576 }")
          echo "$RUNNER_OS: $bin = $size bytes ($mib MiB)"
          {
            echo "### Binário release ($RUNNER_OS)"
            echo
            echo "| arquivo | bytes | MiB |"
            echo "|---|---|---|"
            echo "| \`$bin\` | $size | $mib |"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( size >= 8 * 1024 * 1024 )); then
            echo "::error::binário com $mib MiB passa do teto de 8 MB"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openkax-${{ runner.os }}
          path: target/release/openkax${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
